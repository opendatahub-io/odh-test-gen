# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true

knowledge_base:
  opt_out: false
  learnings:
    scope: local   # keep learnings repo-scoped

reviews:
  request_changes_workflow: true

  auto_review:
    auto_pause_after_reviewed_commits: 0

  # Ensure we don't waste budget on dependencies/lint noise, but scan all
  # logic and enforcement paths (pre-commit hooks, Makefile targets, agent
  # instructions) so those can't be weakened without review.
  path_filters:
    - "!uv.lock"
    - "!.skillsaw.yaml"
    - "!README.md"
    - "!CHANGELOG.md"

  path_instructions:
    # ── 1. Python Scripts (scripts/**/*.py) ───────────────────────────
    - path: "scripts/**/*.py"
      instructions: |
        PYTHON DETERMINISTIC SCRIPTS:
        1. NO-LLM INVARIANT: Scripts in this directory must be fully deterministic. Flag any LLM or AI API call — none are allowed here.
        2. SECRET PROTECTION: Never hardcode credentials. Jira credentials must be read from environment variables (JIRA_URL, JIRA_USER, JIRA_TOKEN); GitHub auth goes through the `gh` CLI's own session, not an env var. Secrets must never appear in command arguments, URLs, logs, exception messages, JSON output, or generated artifacts. Flag any hardcoded secret, token, or leaked credential in output.
        3. STRUCTURED ERRORS: CLI entry points must catch expected failures and return a structured JSON block, e.g. {"status": "failed", "error": "..."}.
           Reusable helpers must preserve typed exceptions for callers and tests.

    # ── 2. Claude Code Plugin Skills (skills/**/*.md) ──────────────────
    - path: "skills/**/*.md"
      instructions: |
        CLAUDE CODE SKILLS (SKILL.md):
        1. PROCEDURAL DELEGATION: Skill prompts must NOT embed complex procedural logic or multi-step algorithms. Any parsing, strategy extraction, or AST mapping must be delegated to a deterministic Python helper in scripts/. Flag inline procedural logic that belongs in a script.
        2. PLACEHOLDERS: Flag leftover placeholder text, TODOs, or unconfigured template variables in instructions.

    # ── 3. Test Suites (tests/**/*.py) ──────────────────
    - path: "tests/**/*.py"
      instructions: |
        TEST CORRECTNESS & MEANINGFULNESS:
        A linter already enforces coverage; your job is to judge whether each test can actually catch a bug. Flag tests exhibiting these anti-patterns:
        1. NO EFFECTIVE ASSERTION: The test runs code but asserts nothing, or only asserts trivially-true things (e.g. `assert True`, `assert result is not None` as the sole check, asserting a literal against itself).
        2. MOCKING THE UNIT UNDER TEST: The function/class being tested is itself mocked or patched, so the real logic never executes. Only collaborators/external boundaries (HTTP, Jira, filesystem, subprocess) should be mocked.
        3. ASSERTING ONLY ON THE MOCK: For a function that returns a value or produces an observable effect (file written, JSON emitted), the test must also assert on that value/effect — not solely that a mock was called. Do NOT flag this for pure side-effect functions with no return value (e.g. API callers, writers), where `mock.assert_called_once_with(...)` is a valid and sufficient assertion.
        4. TAUTOLOGICAL / UNFALSIFIABLE: The expected value is derived from the same code path that produces the actual value, so the assertion cannot fail.
        5. SWALLOWED FAILURE: try/except that hides assertion errors, or `pytest.raises` blocks so broad they would pass even when the wrong exception is raised.
        6. WEAK JSON CHECKS: For scripts that output JSON, tests must assert on the parsed structure/values, not just that stdout is non-empty or contains a substring.
        Only raise these when you can point to the specific line; do not speculate about untested behavior that isn't in the diff.
